name: Build Kata release (Cohere)

on:
  push:
    branches:
      - "cohere-*"
    tags:
      - "kata-v*"
  pull_request:
    branches:
      - "cohere-*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Build every component from this commit: upstream's cached artefacts are
  # keyed by upstream branches, not by this fork.
  USE_CACHE: "no"
  PUSH_TO_REGISTRY: "no"
  RELEASE: "no"
  # Without a pin the guest kernel is built without module signing, as the
  # hand-built 4.4.0 guest was. The modules ship inside the dm-verity images,
  # which RTMR2 pins through kernel_verity_params.
  KBUILD_SIGN_PIN: ""

jobs:
  build-shim:
    name: build-shim (x86_64, musl)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install yq
        run: ./ci/install_yq.sh
        env:
          INSTALL_IN_GOPATH: false

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get -y install musl-tools protobuf-compiler cmake clang

      - name: Install rust
        run: |
          ./tests/install_rust.sh
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build containerd-shim-kata-v2
        working-directory: src/runtime-rs
        run: make runtime BUILD_TYPE=release ARCH=x86_64 LIBC=musl

      - name: Collect the shim
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/containerd-shim-kata-v2 dist/
          cd dist
          sha256sum containerd-shim-kata-v2 | tee containerd-shim-kata-v2.sha256
          echo "\`$(cat containerd-shim-kata-v2.sha256)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Store the shim
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: containerd-shim-kata-v2-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 90

  build-asset:
    name: build-asset
    # Pull requests only build the shim; the guest takes about an hour.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        asset:
          - agent
          - busybox
          - kernel-nvidia-gpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the build derives versions from the commit history
          persist-credentials: false

      - name: Build ${{ matrix.asset }}
        run: |
          make "${KATA_ASSET}-tarball"
          build_dir=$(readlink -f build)
          mkdir -p kata-build && cp "${build_dir}"/kata-static-"${KATA_ASSET}"*.tar.* kata-build/.
        env:
          KATA_ASSET: ${{ matrix.asset }}
          USE_DEVMAPPER: ${{ matrix.asset == 'agent' && 'yes' || 'no' }}

      - name: Store ${{ matrix.asset }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kata-artifacts-amd64-${{ matrix.asset }}
          path: kata-build/kata-static-${{ matrix.asset }}.tar.zst
          retention-days: 15
          if-no-files-found: error

      - name: Store ${{ matrix.asset }} modules
        if: matrix.asset == 'kernel-nvidia-gpu'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kata-artifacts-amd64-${{ matrix.asset }}-modules
          path: kata-build/kata-static-${{ matrix.asset }}-modules.tar.zst
          retention-days: 15
          if-no-files-found: error

  build-guest-image:
    name: build-guest-image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: build-asset
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        asset:
          - rootfs-image-nvidia
          - rootfs-image-nvidia-gpu-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Get build-asset outputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: kata-artifacts-amd64-*
          path: kata-artifacts
          merge-multiple: true

      - name: Build ${{ matrix.asset }}
        run: |
          make install-prebuilt-artifacts
          make DEPS= "${KATA_ASSET}-tarball"
          build_dir=$(readlink -f build)
          mkdir -p kata-build && cp "${build_dir}"/kata-static-"${KATA_ASSET}".tar.zst kata-build/.
        env:
          KATA_ASSET: ${{ matrix.asset }}

      - name: Record the root hash
        run: |
          tar --zstd -xOf "kata-build/kata-static-${KATA_ASSET}.tar.zst" \
            --wildcards './opt/kata/share/kata-containers/root_hash_*.txt' \
            | tee "kata-build/${KATA_ASSET}.root_hash"
          {
            echo "### ${KATA_ASSET}"
            echo '```'
            cat "kata-build/${KATA_ASSET}.root_hash"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          KATA_ASSET: ${{ matrix.asset }}

      - name: Store ${{ matrix.asset }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kata-guest-amd64-${{ matrix.asset }}
          path: |
            kata-build/kata-static-${{ matrix.asset }}.tar.zst
            kata-build/${{ matrix.asset }}.root_hash
          retention-days: 15
          if-no-files-found: error

  assemble:
    name: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [build-shim, build-guest-image]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install yq
        run: ./ci/install_yq.sh
        env:
          INSTALL_IN_GOPATH: false

      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Get the guest images
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: kata-guest-amd64-*
          path: inputs
          merge-multiple: true

      - name: Get the guest kernel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: kata-artifacts-amd64-kernel-nvidia-gpu
          path: inputs

      - name: Get the shim
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: containerd-shim-kata-v2-x86_64
          path: inputs

      - name: Assemble the release
        run: ./tools/packaging/cohere/assemble-release.sh inputs dist
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Store the release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kata-release
          path: dist/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: publish
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/kata-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: assemble
    permissions:
      contents: read
      packages: write # push the release to ghcr.io
      id-token: write # sign the provenance
      attestations: write # store the provenance
    env:
      RELEASE_IMAGE: ghcr.io/${{ github.repository }}/kata-release
    steps:
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Get the release
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: kata-release
          path: dist

      - name: Push the release
        id: push
        working-directory: dist
        run: |
          # Tags name the release; a manual run is named after its commit. A
          # name is never reused: "Re-run all jobs" publishes <name>-r<attempt>.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            prefix="kata-v$(jq -r .kata_version release.json)-cohere."
            if [[ "${tag}" != "${prefix}"* ]]; then
              echo "::error::release tags must start with ${prefix}"
              exit 1
            fi
          else
            tag="sha-${GITHUB_SHA}"
          fi
          if [[ "${GITHUB_RUN_ATTEMPT}" -gt 1 ]]; then
            tag="${tag}-r${GITHUB_RUN_ATTEMPT}"
          fi
          echo "${GITHUB_TOKEN}" | oras login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          if resolved="$(oras resolve "${RELEASE_IMAGE}:${tag}" 2>&1)"; then
            echo "::error::refusing to replace ${RELEASE_IMAGE}:${tag} (${resolved})"
            exit 1
          elif ! grep -qi 'not found' <<< "${resolved}"; then
            echo "::error::could not check that ${RELEASE_IMAGE}:${tag} is unused: ${resolved}"
            exit 1
          fi
          oras push "${RELEASE_IMAGE}:${tag}" \
            --artifact-type application/vnd.cohere.kata.release \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "com.cohere.kata.version=$(jq -r .kata_version release.json)" \
            --annotation "com.cohere.nvidia.driver=$(jq -r .nvidia_driver_version release.json)" \
            kata-release.tar.zst:application/vnd.cohere.kata.release.tar+zstd \
            release.json:application/vnd.cohere.kata.release+json
          digest="$(oras manifest fetch "${RELEASE_IMAGE}:${tag}" --descriptor | jq -r .digest)"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "\`${RELEASE_IMAGE}:${tag}@${digest}\`" >> "${GITHUB_STEP_SUMMARY}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ${{ env.RELEASE_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
