# Inputs of the Cohere Kata release that this commit does not build. The
# guest kernel and images are built from versions.yaml and the shim from
# src/runtime-rs. Changing anything here changes the guest measurements.

# The upstream release provides QEMU, OVMF and the release runtime config.
# OVMF sets the guest's MRTD.
kata_static:
  version: "4.4.0"
  url: "https://github.com/kata-containers/kata-containers/releases/download/4.4.0/kata-static-4.4.0-amd64.tar.zst"
  sha256: "ccbc0cbc591089d0c57012b78da64b23ef43e0bac0f869dc7bfebe8588c33986"

# The CoCo extension (attestation agent with the evidence API TNG calls), from
# cohere-ai/guest-components. The digest is of the per-arch disk artifact
# coco-extension-disk:<commit>-ubuntu26.04-amd64.
coco_extension:
  image: "ghcr.io/cohere-ai/guest-components/coco-extension-disk"
  digest: ""
  source_repository: "cohere-ai/guest-components"

# The measured runtime config, written to config.d/50-cohere.toml.
runtime:
  name: "kata-qemu-nvidia-gpu-tdx-runtime-rs"
  # The release's kernel_params, plus the agent serving attestation evidence
  # on 127.0.0.1:8006. A drop-in replaces the whole string.
  kernel_params: "cgroup_no_v1=all pci=realloc pci=nocrs pci=assign-busses nvrc.smi.srs=1 agent.guest_components_rest_api=all"
  # Kata's default, 50 s, is too short when several multi-GPU guests start on
  # one host.
  qmp_connect_timeout_ms: 180000
  # The host's QGS listens on vsock CID 2, this port.
  qgs_port: 4050
  # Written by the cluster; a pod fails to start if it is missing.
  registry_auth_file: "/etc/kata-containers/registry-auth.json"
